<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>取号终端</title>
<style>
  body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;margin:2rem;background:#0f2027;color:#fff;text-align:center}
  .big{font-size:4rem;font-weight:800;background:#000;padding:.5rem 2rem;border-radius:1rem;display:inline-block}
  button{font-size:1.3rem;padding:.8rem 2rem;border:none;border-radius:10px;background:#ffd54a;cursor:pointer;margin:.5rem}
  .card{background:rgba(255,255,255,.08);border-radius:10px;padding:1rem;margin:1rem auto;max-width:560px;text-align:left}
  .offline-tag{color:#ff8a80;font-weight:700}
  ul{text-align:left;max-width:560px;margin:auto}
</style>
</head>
<body>
<h1>自助取号</h1>
<div class="card">
  <label><input type="checkbox" id="offline"> 模拟断网</label>
  <span id="lease-info"></span>
</div>
<button id="take">取 号</button>
<div id="ticket"></div>
<div id="msg"></div>
<div class="card">
  <b>断网策略（本终端实施）：</b>
  <ul>
    <li>在线：服务器集中分配号码</li>
    <li>断网但持有效租约：本地按租约号段发号（跨日稳定 ticket_id 本地生成），恢复后自动同步</li>
    <li>断网且无租约：无法取号</li>
  </ul>
</div>
<ul id="outbox"></ul>
<script src="/static/kiosk.js"></script>
</body>
</html>
